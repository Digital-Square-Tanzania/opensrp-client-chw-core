// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://jitpack.io' }
        maven { url "https://repo.maven.apache.org/maven2" }
        maven { url "https://cloudant.github.io/cloudant-sync-eap/repository" }
        maven{  url "https://plugins.gradle.org/m2/" }
        mavenLocal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
        classpath 'gradle.plugin.org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.10.2'
        classpath "io.codearte.gradle.nexus:gradle-nexus-staging-plugin:0.11.0"
        classpath 'org.smartregister:gradle-jarjar-plugin:1.0.0-SNAPSHOT'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply plugin: 'com.github.kt3k.coveralls'
apply plugin: 'jacoco'
apply plugin: 'io.codearte.nexus-staging'

jacoco {
    toolVersion = "0.8.11"
}

allprojects {

    tasks.whenTaskAdded { task ->
        if (task.name.toLowerCase().startsWith("lint")) {
            task.enabled = false
        }
    }

    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven { url 'https://maven.google.com' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        maven { url 'https://jitpack.io' }
        maven { url "https://acra.googlecode.com/svn/repository/releases" }
        maven { url "https://repo.maven.apache.org/maven2" }
        maven { url "https://cloudant.github.io/cloudant-sync-eap/repository" }
        maven { url 'https://maven.fabric.io/public' }
        maven { url "https://s3.amazonaws.com/repo.commonsware.com" }
        maven { url "https://s3.amazonaws.com/repo.commonsware.com" }
        maven {
            url "http://maven.wafour.com:8081/artifactory/libs-release/"
            allowInsecureProtocol = true
        }
        maven{  url "https://plugins.gradle.org/m2/" }
        jcenter()
    }

    plugins.withId("jacoco") {
        jacoco {
            toolVersion = "0.8.11"
        }
    }
}

configure(allprojects) { project ->

    version = VERSION_NAME
    group = GROUP
    buildscript {
        repositories {
            google()
            jcenter()
            mavenCentral()
            mavenLocal()
            maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
        }
    }
}


project.ext.preDexLibs = !project.hasProperty('disablePreDex')

subprojects {

    group = 'org.smartregister'

    ext.androidToolsBuildGradle     = '7.2.2'
    ext.androidBuildToolsVersion    = '33.0.2'
    ext.androidMinSdkVersion        = 18
    ext.androidCompileSdkVersion    = 28
    ext.androidTargetSdkVersion     = 28

    ext.androidAnnotationsVersion = '3.0.1'
    ext.androidAnnotationsAPIVersion = '3.0.1'

    // Improve build server performance by allowing disabling of pre-dexing
    // (see http://tools.android.com/tech-docs/new-build-system/tips#TOC-Improving-Build-Server-performance.)
    project.plugins.whenPluginAdded { plugin ->
        if ("com.android.build.gradle.AppPlugin".equals(plugin.class.name)
                || "com.android.build.gradle.LibraryPlugin".equals(plugin.class.name)) {
            if (project.android.hasProperty('dexOptions')) {
                project.android.dexOptions.preDexLibraries = rootProject.ext.preDexLibs
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

task jacocoTestReport(type: JacocoReport) {
    sourceDirectories.setFrom(files())
    classDirectories.setFrom(files())
    executionData.setFrom(files())

    reports {
        html {
            required.set(true)
            outputLocation.set(file("${buildDir}/reports/jacoco/jacocoRootReport/jacocoFullReport"))
        }

        xml {
            required.set(true)
            outputLocation.set(file("${buildDir}/reports/jacoco/jacocoRootReport/jacocoFullReport.xml"))
        }

        csv.required.set(false)
    }
    onlyIf {
        executionData.files.any { it.exists() }
    }
}

gradle.projectsEvaluated {
    def javaSubprojects = subprojects.findAll { subproject ->
        subproject.pluginManager.hasPlugin('java')
    }

    tasks.named('jacocoTestReport', JacocoReport).configure { reportTask ->
        javaSubprojects.each { subproject ->
            reportTask.additionalSourceDirs.from(subproject.sourceSets.main.allJava.srcDirs)
            reportTask.additionalClassDirs.from(subproject.sourceSets.main.output)
            if (subproject.pluginManager.hasPlugin('jacoco')) {
                reportTask.executionData.from(subproject.tasks.jacocoTestReport.executionData)
            }
        }
    }
}

task build {
    dependsOn tasks.jacocoTestReport
}

def isReleaseBuild() {
    return version.contains("SNAPSHOT") == false
}
